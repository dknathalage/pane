name: Release plugins

# release-please maintains a release PR from conventional commits on main.
# Merging that PR cuts the plugins-vX.Y.Z tag + GitHub release; the second job
# then builds the plugin zips, uploads them as release assets, and syncs the
# download URLs in marketplace.json.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and package plugins
        run: build/package-plugins.sh

      - name: Upload plugin zips to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/plugins-release/*.zip --clobber

      - name: Sync marketplace.json download URLs
        run: build/sync-marketplace.sh "${{ needs.release-please.outputs.version }}"

      - name: Commit marketplace.json sync
        run: |
          if git diff --quiet marketplace.json; then
            echo "marketplace.json already in sync."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace.json
          git commit -m "chore: sync marketplace.json to ${{ needs.release-please.outputs.tag_name }} [skip ci]"
          git push
