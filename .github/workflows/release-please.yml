name: Release Pane

# release-please maintains a release PR from conventional commits on main.
# Merging that PR cuts the pane-vX.Y.Z tag + GitHub release; the second job
# then builds Pane.app for each supported RID, zips it, and uploads the
# zip as a release asset.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Pane.app (${{ matrix.rid }})
        run: bash build/make-app.sh ${{ matrix.rid }} dist

      - name: Zip Pane.app
        run: |
          cd dist
          zip -qry Pane-${{ matrix.rid }}.zip Pane.app

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/Pane-${{ matrix.rid }}.zip --clobber
